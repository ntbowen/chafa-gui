# Chafa GUI - Build and Release Workflow
# 
# This workflow builds the application for all supported platforms:
# - Linux x86-64 (RPM, DEB)
# - Windows x86-64 (ZIP)
# - macOS Intel (DMG)
# - macOS Apple Silicon (DMG)
#
# Triggers:
# - Push to main/master branch: Build all platforms (artifacts only)
# - Push tags (v*): Build all platforms and create GitHub Release
# - Pull requests: Build all platforms for testing
# - Manual: workflow_dispatch for on-demand builds
#
# Release Creation:
# - Only happens when pushing a tag (e.g., v1.0.0)
# - All build artifacts are automatically attached
# - Detailed release notes are auto-generated

name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            chafa

      - name: Install frontend dependencies
        run: npm ci

      - name: Build application
        run: npm run tauri:build

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm


  build-windows:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install MinGW
        run: |
          sudo apt update
          sudo apt install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Configure Cargo for Windows
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << EOF
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          ar = "x86_64-w64-mingw32-ar"
          EOF

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Windows binary
        run: |
          cd src-tauri
          cargo build --release --target x86_64-pc-windows-gnu

      - name: Create Windows release package
        run: |
          mkdir -p chafa-gui-windows-x64
          cp src-tauri/target/x86_64-pc-windows-gnu/release/chafa-gui.exe chafa-gui-windows-x64/
          cp README.md chafa-gui-windows-x64/
          cat > chafa-gui-windows-x64/README.txt << 'EOF'
          Chafa GUI - Windows x64

          Requirements:
          1. Install Chafa for Windows
             Download: https://hpjansson.org/chafa/download/
          
          2. Windows 10 1809+ or Windows 11
          3. Microsoft Edge WebView2 Runtime (usually pre-installed)

          Usage:
          Double-click chafa-gui.exe to run

          For more information:
          https://github.com/yourusername/chafa-gui
          EOF
          zip -r chafa-gui-windows-x64.zip chafa-gui-windows-x64/

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: chafa-gui-windows-x64.zip

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            arch: x64
          - os: macos-14
            target: aarch64-apple-darwin
            arch: aarch64
        
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Chafa
        run: brew install chafa

      - name: Install frontend dependencies
        run: npm ci

      - name: Build application
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Organize release files
        run: |
          mkdir -p release
          
          # Get version from tag
          VERSION=${GITHUB_REF#refs/tags/v}
          
          # Linux files - rename to unified format
          find artifacts/linux-deb -name "*.deb" -exec cp {} release/chafa-gui-${VERSION}-linux-amd64.deb \; || true
          find artifacts/linux-rpm -name "*.rpm" -exec cp {} release/chafa-gui-${VERSION}-linux-x86_64.rpm \; || true
          
          # Windows files - rename to include version
          find artifacts/windows-x64 -name "*.zip" -exec cp {} release/chafa-gui-${VERSION}-windows-x64.zip \; || true
          
          # macOS files - rename to include version
          find artifacts/macos-x64-dmg -name "*.dmg" -exec cp {} release/chafa-gui-${VERSION}-macos-intel.dmg \; || true
          find artifacts/macos-aarch64-dmg -name "*.dmg" -exec cp {} release/chafa-gui-${VERSION}-macos-apple-silicon.dmg \; || true
          
          # List all files
          ls -lh release/

      - name: Generate Release Notes
        run: |
          cat > release_notes.md << 'EOF'
          # Chafa GUI ${{ github.ref_name }}
          
          Cross-platform Tauri desktop application for Chafa image to ANSI art conversion.
          
          ## 🎯 Supported Platforms
          
          ### Linux x86-64
          - **RPM Package** (Recommended) - For Fedora/RHEL/CentOS
          - **DEB Package** (Recommended) - For Debian/Ubuntu
          
          ### Windows x86-64
          - **ZIP Package** - Extract and run
          - Requirements: Windows 10 1809+ or Windows 11
          - Need to install: Chafa for Windows, WebView2 Runtime
          
          ### macOS
          - **Intel DMG** - For Intel-based Macs (macOS 10.15+)
          - **Apple Silicon DMG** - For M1/M2/M3 Macs (macOS 11.0+)
          - Requirement: Chafa (install via `brew install chafa`)
          
          ## 📦 Installation
          
          ### Linux (Fedora/RHEL)
          \`\`\`bash
          sudo rpm -ivh chafa-gui-*-linux-x86_64.rpm
          chafa-gui
          \`\`\`
          
          ### Linux (Debian/Ubuntu)
          \`\`\`bash
          sudo dpkg -i chafa-gui-*-linux-amd64.deb
          chafa-gui
          \`\`\`
          
          ### Windows
          1. Extract `chafa-gui-*-windows-x64.zip`
          2. Install [Chafa for Windows](https://hpjansson.org/chafa/download/)
          3. Double-click `chafa-gui.exe`
          
          ### macOS
          1. Download the appropriate DMG (Intel or Apple Silicon)
          2. Install Chafa: `brew install chafa`
          3. Open the DMG and drag the app to Applications
          4. Right-click and select "Open" (first time only)
          
          ## ✨ Features
          
          - 🎨 Modern React UI with TailwindCSS
          - 🖼️ Real-time ANSI art preview
          - 💾 Native file dialogs
          - ⚡ Fast native performance (Tauri + Rust)
          - 🔧 Multiple output modes (symbols, sixels, kitty, iterm2)
          - 🎨 Full color support (2/8/16/256/full colors)
          - 📏 Customizable output dimensions
          
          ## 📚 Documentation
          
          - [User Guide](https://github.com/ntbowen/chafa-gui/blob/main/README.md)
          - [Build Instructions](https://github.com/ntbowen/chafa-gui/tree/main/docs)
          
          ## 🐛 Bug Reports
          
          Please report issues at: https://github.com/ntbowen/chafa-gui/issues
          
          ## 💡 About
          
          Built with:
          - [Tauri 2.9](https://tauri.app/) - Application framework
          - [React 18](https://react.dev/) - UI framework
          - [Chafa](https://hpjansson.org/chafa/) - Image conversion engine
          - [Rust](https://www.rust-lang.org/) - Backend language
          EOF
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
