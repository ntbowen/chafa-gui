name: Build macOS

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            arch: x64
            runner-arch: Intel
          - os: macos-14
            target: aarch64-apple-darwin
            arch: aarch64
            runner-arch: Apple Silicon
        
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Chafa (macOS)
        run: brew install chafa

      - name: Verify Chafa installation
        run: chafa --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri application
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: List bundle contents
        run: |
          echo "=== DMG files ==="
          ls -lh src-tauri/target/${{ matrix.target }}/release/bundle/dmg/ || echo "No DMG found"
          echo ""
          echo "=== App bundles ==="
          ls -lh src-tauri/target/${{ matrix.target }}/release/bundle/macos/ || echo "No App found"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-app
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: warn

      - name: Build Summary
        run: |
          echo "## macOS Build Summary (${{ matrix.runner-arch }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: macOS ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: ${{ matrix.os }} (${{ matrix.runner-arch }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" ]; then
            echo "### DMG Files:" >> $GITHUB_STEP_SUMMARY
            ls -lh src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          fi
