[package]
name = "chafa-gui"
version = "1.0.0"
description = "A modern GUI for Chafa image-to-ANSI converter"
authors = ["Chafa GUI Developer"]
license = "MIT"
repository = "https://github.com/yourusername/chafa-gui"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.9", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "6.0"
