<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="80" fill="url(#bgGrad)"/>
  
  <!-- 电脑屏幕框架 -->
  <rect x="80" y="80" width="352" height="264" rx="12" fill="#374151" stroke="#4b5563" stroke-width="4"/>
  
  <!-- 屏幕内容 -->
  <rect x="96" y="96" width="320" height="232" rx="6" fill="url(#screenGrad)"/>
  
  <!-- ASCII艺术代表 - 彩色方块 -->
  <g opacity="0.9">
    <!-- 第一行 -->
    <rect x="120" y="120" width="24" height="24" fill="#ef4444" opacity="0.8"/>
    <rect x="156" y="120" width="24" height="24" fill="#f59e0b" opacity="0.8"/>
    <rect x="192" y="120" width="24" height="24" fill="#eab308" opacity="0.8"/>
    <rect x="228" y="120" width="24" height="24" fill="#22c55e" opacity="0.8"/>
    <rect x="264" y="120" width="24" height="24" fill="#3b82f6" opacity="0.8"/>
    <rect x="300" y="120" width="24" height="24" fill="#a855f7" opacity="0.8"/>
    <rect x="336" y="120" width="24" height="24" fill="#ec4899" opacity="0.8"/>
    
    <!-- 第二行 -->
    <rect x="120" y="156" width="24" height="24" fill="#f97316" opacity="0.8"/>
    <rect x="156" y="156" width="24" height="24" fill="#84cc16" opacity="0.8"/>
    <rect x="192" y="156" width="24" height="24" fill="#10b981" opacity="0.8"/>
    <rect x="228" y="156" width="24" height="24" fill="#14b8a6" opacity="0.8"/>
    <rect x="264" y="156" width="24" height="24" fill="#06b6d4" opacity="0.8"/>
    <rect x="300" y="156" width="24" height="24" fill="#8b5cf6" opacity="0.8"/>
    <rect x="336" y="156" width="24" height="24" fill="#d946ef" opacity="0.8"/>
    
    <!-- 第三行 -->
    <rect x="120" y="192" width="24" height="24" fill="#fbbf24" opacity="0.8"/>
    <rect x="156" y="192" width="24" height="24" fill="#a3e635" opacity="0.8"/>
    <rect x="192" y="192" width="24" height="24" fill="#34d399" opacity="0.8"/>
    <rect x="228" y="192" width="24" height="24" fill="#2dd4bf" opacity="0.8"/>
    <rect x="264" y="192" width="24" height="24" fill="#38bdf8" opacity="0.8"/>
    <rect x="300" y="192" width="24" height="24" fill="#a78bfa" opacity="0.8"/>
    <rect x="336" y="192" width="24" height="24" fill="#f0abfc" opacity="0.8"/>
    
    <!-- 第四行 -->
    <rect x="120" y="228" width="24" height="24" fill="#fde047" opacity="0.8"/>
    <rect x="156" y="228" width="24" height="24" fill="#bef264" opacity="0.8"/>
    <rect x="192" y="228" width="24" height="24" fill="#6ee7b7" opacity="0.8"/>
    <rect x="228" y="228" width="24" height="24" fill="#5eead4" opacity="0.8"/>
    <rect x="264" y="228" width="24" height="24" fill="#7dd3fc" opacity="0.8"/>
    <rect x="300" y="228" width="24" height="24" fill="#c4b5fd" opacity="0.8"/>
    <rect x="336" y="228" width="24" height="24" fill="#f5d0fe" opacity="0.8"/>
  </g>
  
  <!-- 底座 -->
  <rect x="200" y="344" width="112" height="16" rx="4" fill="#4b5563"/>
  <path d="M 180 360 L 332 360 L 312 380 L 200 380 Z" fill="#374151"/>
  
  <!-- 文字 "ANSI" -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">ANSI</text>
</svg>
